name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish (single exe, win-x64)
        run: >
          dotnet publish src/JPEmuRenamer/JPEmuRenamer.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -o publish

      - name: Package
        shell: pwsh
        run: |
          Copy-Item LICENSE publish/LICENSE.txt
          Copy-Item README.md publish/README.md
          Copy-Item src/JPEmuRenamer/Assets/Fonts/OFL-GreatVibes.txt publish/OFL-GreatVibes.txt
          # ZIPの中は JPEmuRenamer フォルダ1つにする（設定は exe の横の data\ に作られるので、フォルダごと持ち運べる）
          Rename-Item publish JPEmuRenamer
          Compress-Archive -Path JPEmuRenamer -DestinationPath JPEmuRenamer-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: JPEmuRenamer-win-x64
          path: JPEmuRenamer-win-x64.zip

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: JPEmuRenamer-win-x64.zip
